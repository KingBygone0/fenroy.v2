name: Build mobile apps

on:
  push:
    branches: [master]
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set, so the release build is unsigned"
          fi

      - name: Build APK and AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION=$(node -p "require('../package.json').version")
          ./gradlew assembleRelease bundleRelease -PversionCode=${{ github.run_number }} -PversionName="$VERSION"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk "../dist/Fenroy-$VERSION-${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/*.aab "../dist/Fenroy-$VERSION-${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v5
        with:
          name: fenroy-android
          path: mobile/dist/*

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios

      # Unsigned build: Sideloadly signs it with your Apple ID when installing.
      - name: Build unsigned IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload dist
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "dist/Fenroy-$VERSION-${{ github.run_number }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v5
        with:
          name: fenroy-ios
          path: mobile/dist/*.ipa

  # Publishes (or refreshes) a GitHub release named after mobile/package.json's version,
  # like the earlier "Fenroy App v1.0.3" release.
  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/out
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$RUNNER_TEMP/assets"
          # An unsigned APK won't install on phones, so only publish it once signing is set up.
          if [ "$SIGNED" = "true" ]; then
            cp "$OUT"/*.apk "$RUNNER_TEMP/assets/fenroy.apk"
          else
            echo "::warning::Android signing secrets missing, so the APK is left out of the release"
          fi
          cp "$OUT"/*.ipa "$RUNNER_TEMP/assets/fenroy-unsigned.ipa"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP"/assets/* \
              --title "Fenroy App $TAG" --target "$GITHUB_SHA" \
              --notes "Built from ${GITHUB_SHA::7}.
          - fenroy.apk: Android (install directly)
          - fenroy-unsigned.ipa: iPhone (install with Sideloadly using your Apple ID)"
          fi
