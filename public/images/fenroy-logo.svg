<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps"
     viewBox="0 0 512 512" width="512" height="512">
  <title>Fenroy</title>

  <!-- Rounded square background — rotated ~8° clockwise to match logo -->
  <g transform="rotate(8, 256, 256)">
    <rect x="28" y="28" width="456" height="456" rx="88" ry="88" fill="#A80000"/>
  </g>

  <!-- Shopping cart — white, centered -->
  <!-- Handle: curves from left up and over like a hook -->
  <path d="M108,230 L108,175 Q108,148 135,143 L182,148"
        fill="none" stroke="white" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cart top bar -->
  <line x1="172" y1="148" x2="355" y2="182"
        stroke="white" stroke-width="30" stroke-linecap="round"/>

  <!-- Cart body (trapezoid) -->
  <path d="M172,148 L355,182 L322,300 L200,300 Z"
        fill="white"/>

  <!-- Left wheel -->
  <circle cx="218" cy="342" r="30" fill="white"/>

  <!-- Right wheel -->
  <circle cx="308" cy="342" r="30" fill="white"/>

</svg>
